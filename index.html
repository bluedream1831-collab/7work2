<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外倉商品預計運回商品表單</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --border-color: #333; --primary-color: #3498db; --secondary-color: #2ecc71; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f4f7f9; margin: 0; padding: 10px; color: #333; -webkit-tap-highlight-color: transparent; }
        
        /* 密碼驗證層 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 3000; color: white;
        }
        .login-box { background: white; padding: 30px; border-radius: 15px; display: flex; flex-direction: column; gap: 15px; width: 85%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-box h2 { color: #333; margin: 0; text-align: center; font-size: 1.3rem; }
        .login-box input { padding: 15px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 1.2rem; outline: none; }
        .login-box button { padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }

        /* 主容器 */
        .app-container { max-width: 1000px; margin: 0 auto; padding-bottom: 50px; display: none; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        header h2 { margin: 0; font-size: 1.1rem; color: #2c3e50; }
        .btn-help { background: #f39c12; color: white; border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }

        /* 操作手冊彈窗 */
        #help-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4000; justify-content: center; align-items: center; padding: 20px; }
        .help-content { background: white; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; border-radius: 15px; padding: 25px; position: relative; }
        .help-content h3 { margin-top: 0; border-bottom: 2px solid #f1f1f1; padding-bottom: 10px; color: #e67e22; }
        .help-close { background: #eee; border: none; width: 100%; padding: 10px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }

        /* 卡片設計 */
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .card-title { font-weight: bold; margin-bottom: 12px; display: block; border-left: 4px solid var(--primary-color); padding-left: 10px; color: #555; }

        .input-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .input-group { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #777; }
        input, select, textarea { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; background: #fafafa; }
        .highlight-input { background-color: #fff9db !important; border: 1px solid #fab005; font-weight: bold; color: #d9480f; }

        /* 管理清單 */
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #fdfdfd; padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
        .btn-del { background: #ff4d4f; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        /* 按鈕區 */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button.btn-add { background: var(--secondary-color); color: white; grid-column: span 2; font-size: 1.1rem; padding: 15px; font-weight: bold; border:none; border-radius: 8px; }
        .btn-img { background: #e74c3c; color: white; padding: 15px; border:none; border-radius: 8px; font-weight: bold;}
        .btn-xlsx { background: #217346; color: white; padding: 15px; border:none; border-radius: 8px; font-weight: bold;}
        .btn-reset { background: #95a5a6; color: white; grid-column: span 2; margin-top: 10px; padding: 10px; font-size: 0.9rem; border:none; border-radius: 8px;}

        /* 表格預覽 */
        .preview-container { overflow-x: auto; background: #eee; padding: 10px; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
        #capture-area { width: 1000px; background: white; padding: 40px; margin: 0 auto; }
        .main-table { width: 100%; border-collapse: collapse; border: 2px solid var(--border-color); font-size: 18px; }
        .main-table th, .main-table td { border: 1px solid var(--border-color); padding: 8px; text-align: center; height: 42px; }
        .main-table th { background-color: #f2f2f2; font-weight: bold; }
        .product-name { text-align: left; padding-left: 15px !important; width: 280px; }
        .expiry-cell { font-size: 13px; text-align: left; vertical-align: top; white-space: pre-line; width: 210px; line-height: 1.3;}
        .footer-info { display: flex; border: 2px solid var(--border-color); border-top: none; }
        .footer-left { flex: 3; border-right: 1px solid var(--border-color); padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: center;}
        .footer-right { flex: 2; }
        .footer-right table { width: 100%; border-collapse: collapse; }
        .footer-right td { border: 1px solid var(--border-color); padding: 8px; text-align: center; height: 38px;}
        .bg-yellow { background-color: #ffff00 !important; }
    </style>
</head>
<body>

<!-- 操作手冊彈窗 -->
<div id="help-modal">
    <div class="help-content">
        <h3>📖 操作手冊</h3>
        <p><b>1. 登入系統：</b><br>輸入密碼後，系統會記錄您的驗證狀態直到午夜，期間刷新網頁無需重新輸入。</p>
        <p><b>2. 日期與星期：</b><br>系統自動預設下個工作天並計算星期，您手動修改日期後星期也會自動跳轉。</p>
        <p><b>3. 車趟邏輯：</b><br>以 8 板為基準自動計算，您可隨時手動修改黃色趟數欄位。</p>
        <button class="help-close" onclick="toggleHelp()">關閉</button>
    </div>
</div>

<div id="login-overlay">
    <div class="login-box">
        <h2>外倉預計運回系統</h2>
        <input type="password" id="pw-input" placeholder="請輸入通行密碼" onkeyup="if(event.keyCode==13) checkPassword()">
        <button onclick="checkPassword()">登入系統</button>
    </div>
</div>

<div id="app-content" class="app-container">
    <header>
        <h2>外倉運回預計表單</h2>
        <button class="btn-help" onclick="toggleHelp()">📖 使用說明</button>
    </header>

    <div class="card">
        <span class="card-title">1. 基本資料</span>
        <div class="input-row">
            <div class="input-group">
                <label>取貨日期</label>
                <input type="text" id="in-date" oninput="handleDateChange()">
            </div>
            <div class="input-group">
                <label>星期</label>
                <input type="text" id="in-day" readonly style="background:#eee">
            </div>
            <div class="input-group">
                <label>車牌</label>
                <input type="text" id="in-plate" value="KLF-0535" oninput="saveData()">
            </div>
            <div class="input-group">
                <label>趟數 (手改)</label>
                <input type="number" id="manual-runs" class="highlight-input" value="1" oninput="manualUpdateRuns()">
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-title">2. 商品登打</span>
        <div class="input-group" style="margin-bottom:15px">
            <select id="p-preset" onchange="applyPreset()">
                <option value="">-- 快速選擇商品 --</option>
                <option value="0006|冰戀雪捲牛奶|63">0006 - 冰戀雪捲牛奶 (63/板)</option>
                <option value="0011|統一香草杯裝110g|135">0011 - 統一香草杯裝110g (135/板)</option>
                <option value="160060|甜玉米|30">160060 - 甜玉米 (30/板)</option>
                <option value="160066|黃金魚板|28">160066 - 黃金魚板 (28/板)</option>
                <option value="160067|米血糕|28">160067 - 米血糕 (28/板)</option>
            </select>
        </div>
        <div class="input-row">
            <div class="input-group" style="flex: 0 0 70px;"><label>代碼</label><input type="text" id="p-code"></div>
            <div class="input-group"><label>品名</label><input type="text" id="p-name"></div>
        </div>
        <div class="input-row" style="margin-top:10px">
            <div class="input-group"><label>板箱</label><input type="number" id="p-per"></div>
            <div class="input-group"><label>箱數</label><input type="number" id="p-qty" value="0"></div>
            <div class="input-group"><label>板數</label><input type="number" id="p-plt" value="0"></div>
        </div>
        <div class="input-group" style="margin-top:10px"><textarea id="p-exp" rows="2" placeholder="備註/效期"></textarea></div>
        <div class="actions" style="margin-top:15px"><button class="btn-add" onclick="addItem()">+ 加入清單</button></div>
    </div>

    <div class="card" id="manage-section" style="display:none">
        <span class="card-title">3. 項目管理</span>
        <div id="manage-items-container"></div>
    </div>

    <div class="actions">
        <button class="btn-img" onclick="downloadImage()">📸 截圖</button>
        <button class="btn-xlsx" onclick="downloadExcel()">📊 Excel</button>
        <button class="btn-reset" onclick="clearAllData()">⚠️ 清空</button>
    </div>

    <div class="preview-container">
        <div id="capture-area">
            <table class="main-table">
                <thead><tr><th>取貨日</th><th>商品代號</th><th>隆興載回貨品名稱</th><th>板箱數</th><th>數量</th><th>板數</th><th>備註 / 效期</th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div class="footer-info">
                <div class="footer-left"><div id="display-plate" style="font-size: 28px; font-weight: bold;">-</div></div>
                <div class="footer-right">
                    <table>
                        <tr><td style="width: 60px;">車趟</td><td id="display-pallets">0板</td></tr>
                        <tr><td>趟數</td><td id="display-runs" style="font-weight: bold; color: #d35400;">1趟</td></tr>
                        <tr><td>合計</td><td id="display-total" style="font-weight: bold;">0箱</td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let items = [];
    let isManualRuns = false;

    // --- 核心功能：當日自動登入邏輯 ---
    function initAuth() {
        const today = new Date().toLocaleDateString();
        const lastAuthDate = localStorage.getItem('last_auth_date');
        
        if (lastAuthDate === today) {
            // 今天已經登入過
            showApp();
        } else {
            // 沒登入過或已隔日，顯示登入層
            document.getElementById('login-overlay').style.display = 'flex';
        }
    }

    function checkPassword() {
        const pw = document.getElementById('pw-input').value;
        if(pw === '888') {
            const today = new Date().toLocaleDateString();
            localStorage.setItem('last_auth_date', today);
            showApp();
        } else {
            alert('密碼錯誤！');
            document.getElementById('pw-input').value = '';
        }
    }

    function showApp() {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        loadData();
    }

    // --- 日期與星期邏輯 ---
    function getWeekName(dateObj) {
        return ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][dateObj.getDay()];
    }

    function handleDateChange() {
        const dateStr = document.getElementById('in-date').value;
        const dateObj = new Date(dateStr);
        if(!isNaN(dateObj.getTime())) document.getElementById('in-day').value = getWeekName(dateObj);
        saveData();
    }

    function getNextWorkingDay() {
        let date = new Date();
        const holidays = ["2026/01/01", "2026/02/28", "2026/04/04", "2026/04/05", "2026/05/01", "2026/10/10"]; 
        do {
            date.setDate(date.getDate() + 1);
            let dateStr = `${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')}`;
        } while (date.getDay() === 0 || date.getDay() === 6 || holidays.includes(`${date.getFullYear()}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getDate().toString().padStart(2,'0')}`));
        return { dateStr: `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`, dayName: getWeekName(date) };
    }

    // --- 資料管理 ---
    function loadData() {
        const saved = localStorage.getItem('warehouse_data_v6');
        if(saved) {
            const data = JSON.parse(saved);
            document.getElementById('in-date').value = data.date;
            document.getElementById('in-day').value = data.day;
            document.getElementById('in-plate').value = data.plate;
            document.getElementById('manual-runs').value = data.runs;
            items = data.items || [];
            isManualRuns = data.isManual || false;
        } else {
            const nextDay = getNextWorkingDay();
            document.getElementById('in-date').value = nextDay.dateStr;
            document.getElementById('in-day').value = nextDay.dayName;
        }
        renderAll();
    }

    function saveData() {
        localStorage.setItem('warehouse_data_v6', JSON.stringify({
            date: document.getElementById('in-date').value,
            day: document.getElementById('in-day').value,
            plate: document.getElementById('in-plate').value,
            runs: document.getElementById('manual-runs').value,
            items: items,
            isManual: isManualRuns
        }));
        renderAll();
    }

    function addItem() {
        const item = {
            id: Date.now(),
            code: document.getElementById('p-code').value,
            name: document.getElementById('p-name').value,
            per: document.getElementById('p-per').value,
            qty: parseInt(document.getElementById('p-qty').value) || 0,
            plt: parseInt(document.getElementById('p-plt').value) || 0,
            exp: document.getElementById('p-exp').value
        };
        if(!item.name) return alert("請輸入商品名稱");
        items.push(item);
        if(!isManualRuns) document.getElementById('manual-runs').value = Math.ceil(items.reduce((s,i)=>s+i.plt,0) / 8) || 1;
        saveData();
        document.getElementById('p-qty').value = 0; document.getElementById('p-plt').value = 0; document.getElementById('p-exp').value = "";
    }

    function renderAll() {
        const tbody = document.getElementById('table-body');
        const manageContainer = document.getElementById('manage-items-container');
        tbody.innerHTML = ''; manageContainer.innerHTML = '';
        let totalQty = 0, totalPlt = 0;
        document.getElementById('manage-section').style.display = items.length > 0 ? 'block' : 'none';

        for(let i=0; i<8; i++) {
            const item = items[i] || {};
            const row = document.createElement('tr');
            let dateCell = (i === 0) ? document.getElementById('in-date').value : (i === 1 ? document.getElementById('in-day').value : '');
            let dateClass = (i === 1) ? 'bg-yellow' : '';
            row.innerHTML = `<td class="${dateClass}">${dateCell}</td><td>${item.code || ''}</td><td class="product-name">${item.name || ''}</td><td>${item.per || ''}</td><td>${item.qty ? item.qty + '箱' : ''}</td><td>${item.plt ? item.plt + '板' : ''}</td><td class="expiry-cell">${item.exp || ''}</td>`;
            tbody.appendChild(row);
            if(item.id) {
                totalQty += item.qty; totalPlt += item.plt;
                manageContainer.innerHTML += `<div class="manage-item"><div><b>${item.name}</b><br><small>${item.qty}箱/${item.plt}板</small></div><button class="btn-del" onclick="deleteItem(${item.id})">刪除</button></div>`;
            }
        }
        document.getElementById('display-plate').innerText = document.getElementById('in-plate').value;
        document.getElementById('display-total').innerText = totalQty + '箱';
        document.getElementById('display-pallets').innerText = totalPlt + '板';
        document.getElementById('display-runs').innerText = document.getElementById('manual-runs').value + '趟';
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        if(!isManualRuns) document.getElementById('manual-runs').value = Math.ceil(items.reduce((s,i)=>s+i.plt,0) / 8) || 1;
        saveData();
    }

    function manualUpdateRuns() { isManualRuns = true; renderAll(); saveData(); }
    function toggleHelp() {
        const modal = document.getElementById('help-modal');
        modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    function applyPreset() {
        const select = document.getElementById('p-preset');
        if (!select.value) return;
        const [code, name, per] = select.value.split('|');
        document.getElementById('p-code').value = code; document.getElementById('p-name').value = name; document.getElementById('p-per').value = per;
    }

    function clearAllData() {
        if(confirm("確定要清除所有資料嗎？")) {
            localStorage.removeItem('warehouse_data_v6');
            items = []; isManualRuns = false;
            loadData();
        }
    }

    function downloadImage() {
        html2canvas(document.getElementById('capture-area'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `運回清單_${document.getElementById('in-plate').value}.png`;
            link.href = canvas.toDataURL(); link.click();
        });
    }

    function downloadExcel() {
        const excelData = [["取貨日", "商品代號", "品名", "板箱", "箱數", "板數", "備註"]];
        items.forEach((item, index) => {
            let dateCol = (index === 0) ? document.getElementById('in-date').value : (index === 1 ? document.getElementById('in-day').value : "");
            excelData.push([dateCol, item.code, item.name, item.per, item.qty, item.plt, item.exp]);
        });
        const ws = XLSX.utils.aoa_to_sheet(excelData); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "清單"); XLSX.writeFile(wb, `報表.xlsx`);
    }

    // 初始化啟動
    window.onload = initAuth;
</script>

</body>
</html>
